[project]
name = "rom-decoder"
version = "0.1.0"
description = "pcap analyzer/decoder for the ROM: Golden Age network protocol"
requires-python = ">=3.12"
dependencies = [
    "dpkt>=1.9.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rom-decoder-analyze = "decoder.analyze:main"
rom-decoder-web = "decoder.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decoder"]

[tool.ruff]
line-length = 88
target-version = "py312"
