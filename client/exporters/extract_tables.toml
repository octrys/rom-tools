# Configuration for extract_tables.py — the tool takes no CLI arguments.
# Relative paths resolve against this file's directory.

[paths]
# The il2cpp dump (rom-frida's dump_client.js) — the type model: enums, row
# structs, and the table-name -> row-type mapping.
dump_cs = "../../resources/rom_dump.cs"

# The runtime table dump (rom-frida's dump_tables.js): every table's rows,
# fully parsed, keyed by obfuscated field names with enum values as integers.
runtime = "../../resources/tables_runtime.json"

# Curated obfuscated -> friendly field-name map (see table_names.toml).
names = "./table_names.toml"

# Directory the typed JSON tables + coverage report are written to.
output = "../../resources/tables_typed"
