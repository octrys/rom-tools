# Configuration for export_gamedata.py — the tool takes no CLI arguments.
# Relative paths resolve against this file's directory.
#
# This is the projection stage: it reads the full, readable typed tables
# (extract_tables.py output) and emits a minimal, stable, server-facing dataset
# into rom-server-poc/gamedata/. Only fields the game server needs cross the
# boundary, renamed to server conventions so the Go schema does not churn when
# an obfuscated client field name is later resolved in table_names.toml.

[paths]
# Typed tables produced by extract_tables.py.
tables = "../../resources/tables_typed"
# Server-facing output; committed into the game-server repo.
output = "../../resources/gamedata"

[meta]
# Stamped into version.json so the server can refuse mismatched assets.
client_release = "NewPCwemix"
schema_version = 1

# --- entities -------------------------------------------------------------
# Each [[entity]] projects one typed table into one JSON file.
#   fields   dest_name -> dot-path into the source row (renamed to server names)
#   todo     dest_name -> dot-path that is still obfuscated; NOT exported yet,
#            listed so the gap is explicit and easy to fill once resolved
#   filter   keep only rows whose `field` is in `keep` (optional)

[[entity]]
name = "map"
source = "Map_Data"
key = "id"

[entity.fields]
id = "id"
name = "name"
type = "mapType"
width = "size.width"
height = "size.height"
scene_codename = "sceneBundle.codename"
scene_data = "sceneBundle.dataScene"
minimap = "minimap"
battle_zone = "battleZoneType"

# Walkable maps only; instanced trial-tower / time-dungeon variants are excluded.
[entity.filter]
field = "mapType"
keep = ["MT_FIELD", "MT_FIELD_DUNGEON", "MT_FIELD_EXCEPTION", "MT_METROPOLIS", "MT_TIME_FIELD"]
