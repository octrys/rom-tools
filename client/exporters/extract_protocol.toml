# Configuration for extract_protocol.py — the extractor takes no CLI arguments.
# Relative paths resolve against this file's directory.

[paths]
# The client's IL2CPP metadata. It is clean (unencrypted) on PC and carries every
# message class, its ordered fields, and the `__ID__` opcode constant. A client
# update rotates all opcodes, so re-point this at the updated file and re-run.
metadata = "./global-metadata.dat"

# Runtime type dump from frida-il2cpp-bridge (dump_bridge.js) — supplies each
# field's type, which the metadata alone cannot give (the type table lives inside
# the Themida-packed GameAssembly.dll). Set to "" to skip typing (untyped only).
dump = "../../resources/rom_dump.json"

# Directory the protocol JSON/Markdown is written to (created if missing).
output = "../../resources/protocol"
