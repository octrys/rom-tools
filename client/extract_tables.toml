# Configuration for extract_tables.py — the extractor takes no CLI arguments.
# Relative paths resolve against this file's directory.

[paths]
# Local mirror of the CDN patch tree — the folder that contains
# `real/patch/Windows/*.unity` (e.g. mirrored by the patcher). The extractor
# reads the original CDN bundles from there; it never fetches online.
patch = "../resources/patch"

# Directory the extracted JSON tables are written to (created if missing).
output = "../resources/tables"

[extract]
# Asset bundle (a file under real/patch/Windows/) that holds the data tables.
# `tablecrypto.unity` carries the plaintext C_* game-data tables.
bundle = "tablecrypto.unity"

# Base table names to export, without the C_/G_ prefix. Each expands to the data
# TextAsset plus its `_head` row index. Leave empty ([]) to export every table
# found in the bundle.
tables = [
    "Map_Data",
    "MapInfo",
    "Warp_Data",
    "WorldMap",
    "Map_Entry",
    "Map_Time",
    "Map_Buff",
]
