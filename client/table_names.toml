# Obfuscated -> friendly field-name map for type_tables.py.
#
# Three scopes, most specific first:
#   [tables.<TableName>]       — fields on a table's top-level row type.
#   [types.<ShortStructName>]  — shared nested value types; a struct reused
#                                across tables is named once.
#   [global]                   — an identifier the obfuscator uses consistently
#                                across the whole codebase (name it once, applies
#                                everywhere). Fallback after the two above.
# Unmapped fields keep their obfuscated name (nothing is lost). Fill this in
# incrementally; _coverage.json tracks how much of each table is named.
#
# Only high-confidence names are set here (meaning clear from types/values/enums);
# ambiguous fields are deliberately left obfuscated rather than guessed wrong.

# ---- global ---------------------------------------------------------------
# The row id: `DNIEOGFIAHC` is the id field in 95 of 122 tables (obfuscation is
# consistent). Tables that use a different id name are handled per-table below.
[global]
DNIEOGFIAHC = "id"

# ---- shared nested structs ------------------------------------------------

# {codename, scene, dataScene} scene-bundle reference.
[types.KLNCDPFCEIA]
COBIGMMMLJP = "codename"
KGCCDLKLPKA = "scene"
AIFKHKAINEE = "dataScene"

# {codename, scene} batch scene-bundle reference.
