# {width, height} size pair.
[types.NGADEEAOLGP]
BPFBMIDLJKI = "width"
JJGJIEJMNMM = "height"

# {startTime, endTime} schedule window — two struct variants (time / datetime).
[types.ECDDFOAFJCO]
